name: P4 review interface precedence

on:
  pull_request:
  push:
    branches:
      - governance/p4-review-interface-precedence

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify_interface_precedence.py

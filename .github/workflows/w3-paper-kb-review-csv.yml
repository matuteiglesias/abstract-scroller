name: Compatibility proof - Paper KB legacy review CSV

on:
  pull_request:
  push:
    branches:
      - feat/w3-paper-kb-review-csv-proof
      - governance/p4-review-interface-precedence

permissions:
  contents: read

jobs:
  prove-paper-kb-review-csv-edge:
    runs-on: ubuntu-latest
    env:
      PAPER_KB_COMMIT: d65a6f9bd6fff3e2f25768785753856cd9adcb6a
      PAPER_KB_ROOT: ${{ github.workspace }}/upstream/paper-kb

    steps:
      - name: Checkout Abstract Scroller consumer
        uses: actions/checkout@v4

      - name: Checkout pinned historical Paper KB producer
        uses: actions/checkout@v4
        with:
          repository: matuteiglesias/paper-kb
          ref: ${{ env.PAPER_KB_COMMIT }}
          path: upstream/paper-kb
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Abstract Scroller
        run: python -m pip install -e .

      - name: Prove retained legacy CSV compatibility
        run: |
          python scripts/verify_paper_kb_review_csv_edge.py \
            --producer-root "$PAPER_KB_ROOT" \
            --expected-producer-commit "$PAPER_KB_COMMIT"

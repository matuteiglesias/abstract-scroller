# This file declares the repository boundary and its place in the GitHub estate.
schema_version: 1
id: kb.review.snapshot
repository:
  id: repo.abstract-scroller
  github: matuteiglesias/abstract-scroller
domain: knowledge
system: kb.review
role: review-snapshot-surface
lifecycle: active
authority:
  status: proposed
  owns:
  - immutable review snapshot generation
  - snapshot manifest, order and tile representation
  - lightweight reader surface over prepared review records
  does_not_own:
  - paper ingestion or parsing
  - paper-domain review-record contract authority
  - shared interoperability contract authority
  - source evidence selection or promotion policy
  - context routing or MCP transport
interfaces:
  consumes:
  - contract:paper.review-record@1
  compatibility:
  - contract:kb.review-node@1
  - format:review-csv
  produces:
  - artifact:kb.review-snapshot@1
upstream:
- repo.kb-contracts
- repo.paper-kb
downstream: []
canonical_commands:
- make snapshot-review-records INPUT=<paper.review-record.v1.jsonl> OUT=<snapshot-dir>
- make validate OUT=<snapshot-dir>
- make serve
compatibility_commands:
- make snapshot
- make snapshot-csv-legacy LEGACY_CSV_INPUT=<csv> OUT=<snapshot-dir>
- make snapshot-review-node-legacy LEGACY_REVIEW_NODE_INPUT=<jsonl> OUT=<snapshot-dir>
generated_paths:
- data/snapshots/
verification:
  status: bounded-interface-proofs
  last_verified: '2026-08-29'
  command: make snapshot-review-records INPUT=<paper.review-record.v1.jsonl> OUT=<snapshot-dir>
  proven:
  - producer-owned paper.review-record@1 JSONL maps paper_uid to snapshot doc_id without vendoring the producer schema
  - pinned Paper KB P2 output compiles end-to-end into manifest and Brotli tile assets
  compatibility_proven:
  - Paper KB legacy review CSV still compiles to a snapshot through pinned cross-repo CI
  unknowns:
  - review_node_jsonl remains a local compatibility surface and has not been promoted to shared authority
  - snapshot bitset/node stubs remain outside proven scope and should not be interpreted as implemented subsystems
maintenance:
  cadence: quarterly
  next_review: '2026-11-01'
